name: Restore DS profile

on:
  push:
    paths:
      - '.github/workflows/restore-ds-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-ds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore DS brand mark
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="brand brand-lockup" href="#home" aria-label="Deni Setiadi — Home"><span>Deni Setiadi</span></a>'
          new = '<a class="brand brand-lockup" href="#home" aria-label="Deni Setiadi — Home"><span class="brand-mark" aria-hidden="true">DS</span><span class="brand-name">Deni Setiadi</span></a>'
          if old not in s:
              raise SystemExit('Expected header brand markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          cat > brand.css <<'CSS'
          .brand-lockup {
            width: auto;
            height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 0;
            border-radius: 0;
            font-weight: 600;
            letter-spacing: -0.02em;
          }

          .brand-lockup .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            flex: 0 0 38px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.04em;
          }

          .brand-lockup .brand-name {
            color: var(--text);
            font-size: 14px;
            white-space: nowrap;
          }

          .nav-cta.brand-contact-cta {
            border-color: rgba(59, 130, 246, .55);
            color: #dfeafe;
            background: rgba(59, 130, 246, .07);
          }

          .nav-cta.brand-contact-cta:hover {
            border-color: rgba(59, 130, 246, .9);
            background: rgba(59, 130, 246, .12);
          }

          @media (max-width: 620px) {
            .brand-lockup { gap: 8px; }
            .brand-lockup .brand-mark {
              width: 34px;
              height: 34px;
              flex-basis: 34px;
              border-radius: 9px;
              font-size: 12px;
            }
            .brand-lockup .brand-name { font-size: 13px; }
          }
          CSS

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html brand.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore DS profile mark"
          git push
