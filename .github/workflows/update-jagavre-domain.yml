name: Update Jagavre domain metadata

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-jagavre-domain.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update old Vercel domain references
        run: |
          sed -i 's#https://portfolio-developer-linku.vercel.app#https://jagavre-labs.vercel.app#g' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update portfolio domain to jagavre-labs"
            git push
          fi
