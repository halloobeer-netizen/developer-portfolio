name: Polish portfolio hero

on:
  push:
    paths:
      - '.github/workflows/polish-hero.yml'

permissions:
  contents: write

jobs:
  polish-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine hero section without making it busy
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_ref = '<link rel="stylesheet" href="brand.css" />'
          if 'hero-polish.css' not in s:
              if css_ref not in s:
                  raise SystemExit('brand.css reference not found')
              s = s.replace(css_ref, css_ref + '\n  <link rel="stylesheet" href="hero-polish.css" />', 1)

          old = '''        <aside class="hero-panel reveal delay-1" aria-label="Profile summary">
          <div class="panel-topline">
            <span>Selected Focus</span>
            <span>2026</span>
          </div>
          <div class="panel-stat">
            <strong>03</strong>
            <span>Featured production-focused projects</span>
          </div>
          <div class="panel-list">
            <div><span>01</span><p>Business systems & customer platforms</p></div>
            <div><span>02</span><p>Inventory, ordering & operational tools</p></div>
            <div><span>03</span><p>Environmental data & spatial intelligence</p></div>
          </div>
        </aside>'''

          new = '''        <aside class="hero-brand-panel reveal delay-1" aria-label="Deni Setiadi brand identity">
          <div class="hero-brand-topline">
            <span>Software · AI · Data</span>
            <span>2026</span>
          </div>
          <div class="hero-brand-mark">
            <img src="assets/brand-logo.svg" alt="" aria-hidden="true" />
          </div>
          <div class="hero-brand-copy">
            <strong>Building thoughtful systems from concept to production.</strong>
            <span>Full-Stack · Automation · Data Platforms</span>
          </div>
        </aside>'''

          if old not in s:
              raise SystemExit('Existing hero panel not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit hero refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "style: refine elegant portfolio hero"
          git push
