name: Apply new hero logo

on:
  push:
    paths:
      - '.github/workflows/apply-new-hero-logo.yml'

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point hero to new uploaded logo
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/Profil-logo.png'
          new = 'assets/profil-logo.png'
          if old not in s:
              raise SystemExit('Old hero logo reference not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit hero logo update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use latest uploaded hero logo"
          git push
