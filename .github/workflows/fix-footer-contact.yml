name: Fix footer and contact

on:
  push:
    paths:
      - '.github/workflows/fix-footer-contact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact and footer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_contact = '''          <div class="contact-actions">
            <a class="contact-action" href="https://mail.google.com/mail/?view=cm&fs=1&to=halloobeer@gmail.com" target="_blank" rel="noreferrer" aria-label="Email Deni Setiadi">
              <span class="contact-icon gmail-icon" aria-hidden="true"></span>
              <span><small>Email</small><strong>Email Me</strong></span>
            </a>
            <a class="contact-action" href="https://github.com/halloobeer-netizen" target="_blank" rel="noreferrer" aria-label="View GitHub profile">
              <span class="contact-icon github-icon" aria-hidden="true"></span>
              <span><small>GitHub</small><strong>View Profile</strong></span>
            </a>
          </div>'''

          new_contact = '''          <div class="contact-actions">
            <a class="contact-link" href="https://mail.google.com/mail/?view=cm&fs=1&to=halloobeer@gmail.com" target="_blank" rel="noreferrer" aria-label="Email Jagavre Labs">
              <span class="contact-icon gmail-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h18v11H3z"/><path d="m4 7 8 6 8-6"/></svg>
              </span>
              <span><small>Email</small><strong>halloobeer@gmail.com</strong></span>
            </a>
            <a class="contact-link" href="https://github.com/halloobeer-netizen" target="_blank" rel="noreferrer" aria-label="View GitHub profile">
              <span class="contact-icon github-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.12c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.08 1.15A10.7 10.7 0 0 1 12 6.1c.95 0 1.9.13 2.8.38 2.13-1.45 3.08-1.15 3.08-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.63 5.27-5.14 5.55.4.35.76 1.03.76 2.08v3.13c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8Z"/></svg>
              </span>
              <span><small>GitHub</small><strong>github.com/halloobeer-netizen</strong></span>
            </a>
          </div>'''

          if old_contact not in s:
              raise SystemExit('Contact block not found')
          s = s.replace(old_contact, new_contact, 1)

          old_footer = '''  <footer class="site-footer">
    <div class="container footer-wrap">
      <div><strong>Jagavre Labs</strong><span>Founded by Deni Setiadi</span></div>
      <small>© <span id="year"></span> Jagavre Labs</small>
    </div>
  </footer>'''

          new_footer = '''  <footer class="site-footer">
    <div class="container footer-wrap">
      <div class="footer-brand-lockup"><strong>JAGAVRE LABS</strong><span>founded by Deni Setiadi</span></div>
      <small>© <span id="year"></span> Jagavre Labs</small>
    </div>
  </footer>'''

          if old_footer not in s:
              raise SystemExit('Footer block not found')
          s = s.replace(old_footer, new_footer, 1)
          p.write_text(s, encoding='utf-8')

          css = Path('contact-icons.css')
          c = css.read_text(encoding='utf-8')
          extra = '''

/* Jagavre Labs contact + footer refinement */
.site-footer {
  padding: 30px 0 42px;
}
.footer-brand-lockup {
  display: flex;
  align-items: baseline;
  gap: 9px;
  flex-wrap: wrap;
}
.footer-brand-lockup strong {
  color: #dfe5ec;
  font-size: 16px;
  line-height: 1.2;
  font-weight: 750;
  letter-spacing: .08em;
}
.footer-brand-lockup span {
  color: #707984;
  font-size: 11px;
  line-height: 1.4;
  text-transform: none;
}
.contact-link strong {
  overflow-wrap: anywhere;
}
@media (max-width: 620px) {
  .footer-brand-lockup { gap: 6px 8px; }
  .footer-brand-lockup strong { font-size: 15px; }
}
'''
          if '/* Jagavre Labs contact + footer refinement */' not in c:
              c += extra
          css.write_text(c, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html contact-icons.css
          git diff --cached --quiet || git commit -m "fix: restore contact details and refine footer branding"
          git push
