name: Remove header name

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-header-name.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Deni Setiadi text from header brand
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="brand brand-lockup" href="#home" aria-label="Deni Setiadi — Home"><span class="brand-mark" aria-hidden="true">DS</span><span class="brand-name">Deni Setiadi</span></a>'
          new = '<a class="brand brand-lockup" href="#home" aria-label="Deni Setiadi — Home"><span class="brand-mark" aria-hidden="true">DS</span></a>'
          if old not in s:
              raise SystemExit('Expected header brand markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep DS mark only in header"
          git push
