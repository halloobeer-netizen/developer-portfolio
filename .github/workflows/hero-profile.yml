name: Apply elegant profile hero

on:
  push:
    paths:
      - '.github/workflows/hero-profile.yml'

permissions:
  contents: write

jobs:
  apply-hero-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine hero with profile photo
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''        <aside class="hero-brand-panel reveal delay-1" aria-label="Deni Setiadi brand identity">
          <div class="hero-brand-topline">
            <span>Software · AI · Data</span>
            <span>2026</span>
          </div>
          <div class="hero-brand-mark">
            <img src="assets/brand-logo.svg" alt="" aria-hidden="true" />
          </div>
          <div class="hero-brand-copy">
            <strong>Building thoughtful systems from concept to production.</strong>
            <span>Full-Stack · Automation · Data Platforms</span>
          </div>
        </aside>'''

          new = '''        <aside class="hero-profile-panel reveal delay-1" aria-label="Deni Setiadi profile">
          <div class="hero-profile-frame">
            <img class="hero-profile-photo" src="https://avatars.githubusercontent.com/u/316687421?v=4" alt="Deni Setiadi profile photo" />
            <div class="hero-profile-overlay" aria-hidden="true"></div>
          </div>
          <div class="hero-profile-info">
            <span class="hero-profile-role">Software Engineer · AI Solutions Developer</span>
            <strong>Deni Setiadi</strong>
            <span class="hero-profile-focus">Full-Stack · AI · Data Platforms</span>
          </div>
        </aside>'''

          if old not in s:
              raise SystemExit('Current hero panel not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          css = Path('hero-polish.css')
          css.write_text('''
.hero {
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
.hero::before {
  content: "";
  position: absolute;
  width: 520px;
  height: 520px;
  right: -180px;
  top: -180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,.055), rgba(59,130,246,0) 70%);
  pointer-events: none;
}
.hero-grid {
  position: relative;
  z-index: 1;
  align-items: center;
}
.hero-copy { max-width: 790px; }
.hero h1 { max-width: 900px; }
.hero-lead { max-width: 700px; }
.hero-profile-panel {
  position: relative;
  min-height: 430px;
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  background: #101318;
  display: flex;
  flex-direction: column;
}
.hero-profile-frame {
  position: relative;
  flex: 1;
  min-height: 320px;
  overflow: hidden;
  background: #0d0f12;
}
.hero-profile-photo {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 320px;
  object-fit: cover;
  object-position: center;
  filter: saturate(.82) contrast(1.02) brightness(.92);
}
.hero-profile-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(13,15,18,.02) 35%, rgba(13,15,18,.62) 100%),
    linear-gradient(90deg, rgba(13,15,18,.08), rgba(59,130,246,.035));
  pointer-events: none;
}
.hero-profile-info {
  padding: 22px 24px 24px;
  border-top: 1px solid var(--line);
  background: rgba(15,18,23,.98);
}
.hero-profile-role {
  display: block;
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.hero-profile-info strong {
  display: block;
  margin-top: 8px;
  color: #f3f5f7;
  font-size: 22px;
  line-height: 1.2;
  letter-spacing: -.025em;
  font-weight: 600;
}
.hero-profile-focus {
  display: block;
  margin-top: 7px;
  color: #7f8995;
  font-size: 11px;
  letter-spacing: .06em;
}
@media (max-width: 900px) {
  .hero-profile-panel { max-width: 560px; min-height: 390px; }
  .hero-profile-frame, .hero-profile-photo { min-height: 290px; }
}
@media (max-width: 620px) {
  .hero-profile-panel { min-height: 340px; border-radius: 16px; }
  .hero-profile-frame, .hero-profile-photo { min-height: 250px; }
  .hero-profile-info { padding: 18px 20px 20px; }
  .hero-profile-info strong { font-size: 20px; }
}
'''.lstrip(), encoding='utf-8')

      - name: Commit hero profile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hero-polish.css
          git diff --cached --quiet && exit 0
          git commit -m "style: refine hero with profile photo"
          git push
