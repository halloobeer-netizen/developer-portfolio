name: Update JL Branding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-jl-branding.yml'

permissions:
  contents: write

jobs:
  update-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update header and footer branding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a class="brand brand-lockup" href="#home" aria-label="Deni Setiadi — Home"><span class="brand-mark" aria-hidden="true">DS</span></a>', '<a class="brand brand-lockup" href="#home" aria-label="Jagavre Labs — Home"><span class="brand-mark" aria-hidden="true">JL</span></a>')
          s = s.replace('<div><strong>Deni Setiadi</strong><span>Software Engineer · AI Solutions Developer</span></div>\n      <small>© <span id="year"></span> Deni Setiadi</small>', '<div><strong>Jagavre Labs</strong><span>Founded by Deni Setiadi</span></div>\n      <small>© <span id="year"></span> Jagavre Labs</small>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: update header JL and footer Jagavre Labs"
          git push
