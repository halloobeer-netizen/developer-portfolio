name: Cleanup deleted logo references

on:
  push:
    paths:
      - '.github/workflows/cleanup-logo-refs.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove deleted logo references from landing page
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />\n', '')
          s = s.replace('<a class="brand brand-lockup" href="#home" aria-label="Deni Setiadi — Home"><img src="assets/hero-profile-logo.webp" alt="" aria-hidden="true" /><span>Deni Setiadi</span></a>', '<a class="brand brand-lockup" href="#home" aria-label="Deni Setiadi — Home"><span>Deni Setiadi</span></a>')
          s = s.replace('<div class="hero-brand-mark">\n            <img src="assets/hero-profile-logo.webp" alt="" aria-hidden="true" />\n          </div>', '<div class="hero-brand-mark" aria-hidden="true"></div>')
          s = s.replace('assets/hero-profile-logo.webp', '')
          s = s.replace('assets/brand-logo.svg', '')
          s = s.replace('assets/favicon.svg', '')

          p.write_text(s, encoding='utf-8')

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "cleanup: remove stale logo references"
          git push
