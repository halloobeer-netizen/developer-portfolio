name: Apply new portfolio logo

on:
  push:
    paths:
      - '.github/workflows/apply-brand.yml'

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace old logo references
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/brand-logo.svg', 'assets/hero-profile-logo.webp')
          p.write_text(s, encoding='utf-8')

      - name: Commit logo update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use new profile logo across landing page"
          git push
