name: Refresh Jagavre OG metadata

on:
  push:
    paths:
      - '.github/workflows/refresh-jagavre-og.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update metadata and bust OG cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<title>Deni Setiadi — Software Engineer & AI Solutions Developer</title>', '<title>Jagavre Labs — Software Engineering & AI Solutions</title>')
          s = s.replace('Portfolio of Deni Setiadi, Software Engineer & AI Solutions Developer building modern web applications, intelligent digital products, and scalable software solutions.', 'Modern web applications, AI solutions, and scalable data platforms.')
          s = s.replace('<meta name="author" content="Deni Setiadi" />', '<meta name="author" content="Jagavre Labs" />')
          s = s.replace('Deni Setiadi Portfolio', 'Jagavre Labs')
          s = s.replace('Deni Setiadi — Software Engineer & AI Solutions Developer', 'Jagavre Labs — Software Engineering & AI Solutions')
          s = s.replace('https://portfolio-developer-linku.vercel.app/assets/portfolio-og.png"', 'https://portfolio-developer-linku.vercel.app/assets/portfolio-og.png?v=3"')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: refresh Jagavre Labs social metadata"
          git push
