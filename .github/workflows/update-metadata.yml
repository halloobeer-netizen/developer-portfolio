name: Preserve portfolio favicon

on:
  push:
    paths:
      - '.github/workflows/update-metadata.yml'

permissions:
  contents: write

jobs:
  preserve-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore favicon link if missing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          favicon = '  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />\n'
          if 'rel="icon"' not in s:
              marker = '  <link rel="preconnect" href="https://fonts.googleapis.com">'
              s = s.replace(marker, favicon + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit favicon restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve portfolio favicon"
          git push
