name: Fix portfolio email link

on:
  push:
    paths:
      - '.github/workflows/update-metadata.yml'

permissions:
  contents: write

jobs:
  fix-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make email button open Gmail compose
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="btn btn-primary" href="mailto:halloobeer@gmail.com" aria-describedby="contact-note">Email Me</a>'
          new = '<a class="btn btn-primary" href="https://mail.google.com/mail/?view=cm&fs=1&to=halloobeer@gmail.com" target="_blank" rel="noreferrer" aria-describedby="contact-note">Email Me</a>'
          if old not in s:
              raise SystemExit('Current email link not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit email fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: open portfolio email button in Gmail compose"
          git push
