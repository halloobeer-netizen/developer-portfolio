name: Connect portfolio links

on:
  push:
    paths:
      - '.github/workflows/update-metadata.yml'

permissions:
  contents: write

jobs:
  connect-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect repository and contact links without changing layout
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_project = '<a class="project-action" href="#contact">Case Study <span>→</span></a>\n                <span class="project-note">Selected interface walkthrough</span>'
          project_links = [
            '<a class="project-action" href="https://github.com/halloobeer-netizen/karputindo-net" target="_blank" rel="noreferrer">View Repository <span>→</span></a>\n                <span class="project-note">Source code & project repository</span>',
            '<a class="project-action" href="https://github.com/halloobeer-netizen/jagad-stokis" target="_blank" rel="noreferrer">View Repository <span>→</span></a>\n                <span class="project-note">Source code & project repository</span>',
            '<a class="project-action" href="https://github.com/halloobeer-netizen/peatland-intelligence-platform" target="_blank" rel="noreferrer">View Repository <span>→</span></a>\n                <span class="project-note">Source code & project repository</span>',
          ]

          for new_link in project_links:
              if old_project not in s:
                  raise SystemExit('Expected project action placeholder not found')
              s = s.replace(old_project, new_link, 1)

          old_contact = '''        <div class="contact-actions">
          <button class="btn btn-primary contact-placeholder" type="button" aria-describedby="contact-note">Connect Contact Details</button>
          <p id="contact-note">Professional email and GitHub links are the final publishing details to connect.</p>
        </div>'''
          new_contact = '''        <div class="contact-actions">
          <a class="btn btn-primary" href="mailto:halloobeer@gmail.com" aria-describedby="contact-note">Email Me</a>
          <p id="contact-note">GitHub: <a href="https://github.com/halloobeer-netizen" target="_blank" rel="noreferrer">halloobeer-netizen</a></p>
        </div>'''

          if old_contact not in s:
              raise SystemExit('Expected contact placeholder not found')
          s = s.replace(old_contact, new_contact, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit link updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect contact and project repository links"
          git push
