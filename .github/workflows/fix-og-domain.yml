name: Fix OG domain

on:
  push:
    paths:
      - '.github/workflows/fix-og-domain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical and OG URLs
        run: |
          sed -i 's#https://portfolio-static-final.vercel.app/#https://portfolio-developer-linku.vercel.app/#g' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: point OG metadata to current Vercel domain'
            git push
          fi
